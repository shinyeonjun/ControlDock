<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpsHub - 대시보드</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <div class="container">
        <!-- 사이드바 네비게이션 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>OpsHub</h1>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item active">
                    <span>대시보드</span>
                </a>
                <a href="agents.html" class="nav-item">
                    <span>에이전트</span>
                </a>
                <a href="deployments.html" class="nav-item">
                    <span>배포</span>
                </a>
                <a href="announcements.html" class="nav-item">
                    <span>공지</span>
                </a>
            </nav>
        </aside>

        <!-- 메인 컨텐츠 -->
        <main class="main-content">
            <header class="page-header">
                <h2>대시보드</h2>
                <div class="header-actions">
                    <span class="status-indicator online"></span>
                    <span>시스템 정상</span>
                </div>
            </header>

            <!-- 통계 카드 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <h3 id="total-agents">0</h3>
                        <p>총 에이전트</p>
                        <div class="stat-detail">
                            <span class="online-count">온라인: <span id="online-agents">0</span></span>
                            <span class="offline-count">오프라인: <span id="offline-agents">0</span></span>
                        </div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3 id="total-deployments">0</h3>
                        <p>총 배포</p>
                        <div class="stat-detail">
                            <span class="success-count">성공: <span id="success-deployments">0</span></span>
                            <span class="failed-count">실패: <span id="failed-deployments">0</span></span>
                        </div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3 id="running-commands">0</h3>
                        <p>실행 중인 명령</p>
                        <div class="stat-detail">
                            <span class="pending-count">대기: <span id="pending-commands">0</span></span>
                        </div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3 id="recent-announcements">0</h3>
                        <p>최근 공지</p>
                        <div class="stat-detail">
                            <span>24시간 내</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 최근 활동 -->
            <div class="content-grid">
                <div class="content-card">
                    <div class="card-header">
                        <h3>최근 에이전트 활동</h3>
                        <a href="agents.html" class="view-all">전체 보기 →</a>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>호스트명</th>
                                    <th>상태</th>
                                    <th>마지막 체크인</th>
                                    <th>OS</th>
                                </tr>
                            </thead>
                            <tbody id="recent-agents-table">
                                <tr>
                                    <td colspan="4" class="empty-state">데이터 로딩 중...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="content-card">
                    <div class="card-header">
                        <h3>최근 배포 결과</h3>
                        <a href="deployments.html" class="view-all">전체 보기 →</a>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>작업명</th>
                                    <th>상태</th>
                                    <th>성공/실패</th>
                                    <th>완료 시간</th>
                                </tr>
                            </thead>
                            <tbody id="recent-deployments-table">
                                <tr>
                                    <td colspan="4" class="empty-state">데이터 로딩 중...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 시스템 상태 -->
            <div class="content-card">
                <div class="card-header">
                    <h3>시스템 상태</h3>
                </div>
                <div class="system-status">
                    <div class="status-item">
                        <span class="status-label">서버 상태</span>
                        <span class="status-value online">정상</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">TCP 연결</span>
                        <span class="status-value" id="tcp-connections">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">UDP 수신</span>
                        <span class="status-value" id="udp-received">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">프레이밍 프로토콜</span>
                        <span class="status-value success">정상</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
