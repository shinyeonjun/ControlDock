version: '3.8'

services:
  ophub-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ophub-server
    restart: unless-stopped
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    ports:
      # HTTP 서버 (웹 대시보드)
      - "8000:8000/tcp"
      # TCP 서버 (에이전트 등록)
      - "5500:5500/tcp"
      # UDP 서버 (하트비트) - UDP 명시적으로 지정
      - "5501:5501/udp"
      # UDP 서버 (공지 브로드캐스트) - UDP 명시적으로 지정
      - "5502:5502/udp"
    volumes:
      # config.json 마운트 (선택사항)
      - ../config.json:/app/config.json:ro
      # frontend 디렉토리 마운트
      - ../frontend:/app/frontend:ro
    networks:
      - ophub-network
    # 환경 변수 파일
    env_file:
      - .env

networks:
  ophub-network:
    driver: bridge

