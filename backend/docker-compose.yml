version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opshub-backend
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:8000"      # HTTP
      - "0.0.0.0:5500:5500"      # TCP
      - "0.0.0.0:5501:5501/udp"  # UDP 하트비트
      - "0.0.0.0:5502:5502/udp"  # UDP 공지
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8000
      - TCP_HOST=0.0.0.0
      - TCP_PORT=5500
      - UDP_HEARTBEAT_PORT=5501
      - UDP_NOTIFICATION_PORT=5502
    env_file:
      - .env
    volumes:
      # frontend 디렉토리 마운트
      - ../frontend:/app/frontend:ro
      # config.json 마운트 (선택사항)
      - ../config.json:/app/../config.json:ro
    network_mode: bridge
    # Windows에서는 host 네트워크 모드를 사용할 수 없으므로 bridge 모드 사용
    # 포트 포워딩으로 외부 접속 가능

